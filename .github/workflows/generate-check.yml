name: generate-check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate outputs from policy and verify no drift
        run: node src/cli.ts generate-check --check
