name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: TypeScript type-check
        run: npm run typecheck
      - name: Unit, adapter, security and integration tests
        run: npm test
      - name: Python hook tests
        run: npm run test:python
      - name: Python syntax check
        run: python3 -m py_compile runtime/codex/hooks/*.py
      - name: JSON / YAML / TOML validation and policy schema
        run: npm run lint:data
      - name: Markdown lint
        run: npm run lint:md
