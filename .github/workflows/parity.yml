name: parity

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Permission matrix parity (Claude, Codex, Pi)
        run: npm run test:parity
      - name: Parity report
        run: node src/cli.ts verify
