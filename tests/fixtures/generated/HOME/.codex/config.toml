approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "Auto mode"

[permissions."Auto mode"]
extends = ":workspace"
description = "agents-adapter managed workspace profile"

[permissions."Auto mode".filesystem]
":minimal" = "read"
"${HOME}/Desktop/Project" = "write"
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.azure" = "deny"
"~/.gnupg" = "deny"
"~/.kube" = "deny"
"~/.config/gcloud" = "deny"
"~/.config/gh" = "deny"
"~/.git-credentials" = "deny"
"~/.netrc" = "deny"
"~/.npmrc" = "deny"
"~/.pypirc" = "deny"
"~/.docker/config.json" = "deny"
"~/Library/Keychains" = "deny"
"~/.codex/auth.json" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.claude.json" = "deny"
"~/.pi/agent/auth.json" = "deny"
"~/.config/agents-adapter/config.yaml" = "deny"
"~/.gitconfig" = "read"
"~/.config/git" = "read"
"~/.codex/hooks" = "read"
"~/.codex/rules" = "read"
"~/.codex/skills" = "read"
"~/.codex/tmp" = "write"
"~/.cache" = "write"
"~/.npm" = "write"
"~/.nvm/versions/node" = "read"
"/opt/homebrew" = "read"
"/usr/local" = "read"

[permissions."Auto mode".filesystem.":workspace_roots"]
"." = "write"
".git" = "write"
"**/.env.production" = "deny"
"**/.env.production.*" = "deny"
"**/.env.prod" = "deny"
"**/.env.prod.*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"**/*.jks" = "deny"
"**/*.keystore" = "deny"
"**/id_rsa" = "deny"
"**/id_ed25519" = "deny"
"**/id_ecdsa" = "deny"
"**/auth.json" = "deny"
"**/credentials.json" = "deny"
"**/.git-credentials" = "deny"
"**/.netrc" = "deny"
".env.example" = "write"

[permissions."Auto mode".network]
enabled = true

[permissions."Auto mode".network.domains]
"github.com" = "allow"
"api.github.com" = "allow"
"registry.npmjs.org" = "allow"
localhost = "allow"
"127.0.0.1" = "allow"
"**.github.com" = "allow"
"**.githubusercontent.com" = "allow"
"ghcr.io" = "allow"
"**.npmjs.org" = "allow"
"registry.yarnpkg.com" = "allow"
"nodejs.org" = "allow"
"**.nuget.org" = "allow"
"packagist.org" = "allow"
"repo.packagist.org" = "allow"
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"
"**.rubygems.org" = "allow"
"repo.maven.apache.org" = "allow"
"services.gradle.org" = "allow"
"proxy.golang.org" = "allow"
"sum.golang.org" = "allow"
"index.crates.io" = "allow"
"static.crates.io" = "allow"
"registry-1.docker.io" = "allow"
"auth.docker.io" = "allow"
"mcr.microsoft.com" = "allow"

[auto_review]
policy = "# agents-adapter:start\nApprove only reversible, task-scoped development actions whose target and intent are explicit in the current user request.\nNever approve: merge or auto-merge of pull requests, repository deletion, gist creation, credential or token access, force push, push to protected branches, production deploy or production database mutation.\nApprove delete_file, protected-ref update, staging deploy or destructive local operations only when the current user request names that exact action and target.\n# agents-adapter:end"

[apps._default]
approvals_reviewer = "auto_review"
default_tools_approval_mode = "writes"

