# ค่าเริ่มต้นที่ทุก adapter ใช้ร่วมกันเมื่อ user config ไม่ระบุ
version: 1

# path ที่เขียนได้เสมอ (temp และ cache) นอกเหนือจาก development_roots
always_writable:
  - "/tmp"
  - "/private/tmp"
  - "${TMPDIR}"
  - "${HOME}/.cache"
  - "${HOME}/.npm"
  - "${HOME}/.pnpm-store"
  - "${HOME}/Library/Caches"
  - "${HOME}/.composer/cache"
  - "${HOME}/.nuget/packages"
  - "${HOME}/.gradle"
  - "${HOME}/.m2"
  - "${HOME}/.cargo"
  - "${HOME}/go/pkg"
  - "${HOME}/.local/state/agents-adapter"

# path ที่ adapter ของแต่ละ CLI เขียนได้เพื่อจัดการตัวเอง (ยกเว้น credential file ที่ deny ทับ)
agent_config_dirs:
  - "${HOME}/.claude"
  - "${HOME}/.codex"
  - "${HOME}/.pi"
  - "${HOME}/.agents"

# CLI ที่ต้องรันนอก outer sandbox เพราะใช้ keychain/socket/runtime ของตัวเอง
# git network ops ต้องออกด้วย: git เรียก credential helper (gh auth git-credential) เป็น subprocess
# ซึ่งอ่าน ~/.config/gh ไม่ได้ใน sandbox ทำให้ fetch/pull/push ของ private repo พัง
# การออกนอก sandbox ไม่ใช่ bypass permission: deny ของ push main/develop, bare push, force push ยังบังคับตามเดิม
excluded_commands:
  - "gh *"
  - "docker *"
  - "codex *"
  - "dotnet test *"
  - "git push *"
  - "git fetch *"
  - "git pull *"
  - "git ls-remote *"
  - "git clone *"
  # rtk hook (Rust Token Killer) rewrite `git fetch`/`git pull`/`gh`/`docker` เป็น `rtk ...` ก่อนถึง sandbox จึงต้อง match รูปนั้นด้วย
  - "rtk git fetch *"
  - "rtk git pull *"
  - "rtk gh *"
  - "rtk docker *"

# agent type ที่ทำงาน security audit: ห้าม spawn เมื่อ ANTHROPIC_BASE_URL ชี้ provider ที่ไม่ใช่ Anthropic
# content filter ของ provider อื่น (เช่น OpenAI cyber filter) ตอบ 400 และแฟล็ก context ถาวร ทุก request ถัดไปของ agent ตัวนั้นล้มหมด
security_agent_types:
  - auditor
  - skeptic
  - security-review
  - security-reviewer
  - security-auditor

# host ที่ถือว่าเป็น Anthropic โดยตรง (ไม่ตั้ง ANTHROPIC_BASE_URL = Anthropic เช่นกัน)
anthropic_hosts:
  - api.anthropic.com

# domain สาธารณะสำหรับ dependency install (รวมกับ trusted_domains ของ user)
public_registries:
  - github.com
  - api.github.com
  - "*.github.com"
  - "*.githubusercontent.com"
  - ghcr.io
  - registry.npmjs.org
  - "*.npmjs.org"
  - registry.yarnpkg.com
  - nodejs.org
  - "*.nuget.org"
  - packagist.org
  - repo.packagist.org
  - pypi.org
  - files.pythonhosted.org
  - "*.rubygems.org"
  - repo.maven.apache.org
  - services.gradle.org
  - proxy.golang.org
  - sum.golang.org
  - index.crates.io
  - static.crates.io
  - registry-1.docker.io
  - auth.docker.io
  - mcr.microsoft.com
  - localhost
  - 127.0.0.1
