# credential และ path อ่อนไหวที่ต้อง deny ทั้งอ่านและเขียนในทุก CLI
# ค่า ${HOME} จะถูกแทนด้วย home directory ของเครื่องตอน generate
version: 1
credential_paths:
  - "${HOME}/.ssh"
  - "${HOME}/.aws"
  - "${HOME}/.azure"
  - "${HOME}/.gnupg"
  - "${HOME}/.kube"
  - "${HOME}/.config/gcloud"
  - "${HOME}/.config/gh"
  # agent token dir ของ gh ต่อ CLI (trusted-defaults gh_agent_config_subdir): agent ห้ามอ่าน แต่ sandbox ของ CLI เจ้าของ
  # dir ต้องให้ gh subprocess อ่านได้ (Claude ตัดออกจาก denyRead/credentials.files เฉพาะ dir ของตัวเอง; Codex profile read)
  - "${HOME}/.claude/gh"
  - "${HOME}/.codex/gh"
  - "${HOME}/.git-credentials"
  - "${HOME}/.netrc"
  - "${HOME}/.npmrc"
  - "${HOME}/.pypirc"
  - "${HOME}/.docker/config.json"
  - "${HOME}/Library/Keychains"
  - "${HOME}/.codex/auth.json"
  - "${HOME}/.claude/.credentials.json"
  - "${HOME}/.claude.json"
  - "${HOME}/.pi/agent/auth.json"

# basename ที่ถือเป็น credential ไม่ว่าอยู่ที่ไหน
credential_basenames:
  - "id_rsa"
  - "id_ed25519"
  - "id_ecdsa"
  - "auth.json"
  - "credentials.json"
  - ".git-credentials"
  - ".netrc"

# นามสกุลไฟล์ที่ถือเป็น key material
credential_extensions:
  - ".pem"
  - ".key"
  - ".p12"
  - ".pfx"
  - ".jks"
  - ".keystore"

# shell startup, system config และไฟล์ที่ agents-adapter จัดการเอง: อ่านได้ แต่ ASK ก่อนแก้
# ไฟล์ managed ของ adapter อยู่ใน agent config dir (trusted) จึงต้อง list ตรงนี้ ไม่งั้น agent แก้ gate ของตัวเองได้โดยไม่ถาม
system_config_paths:
  - "${HOME}/.config/agents-adapter/config.yaml"
  - "${HOME}/.claude/settings.json"
  - "${HOME}/.claude/hooks"
  - "${HOME}/.codex/config.toml"
  - "${HOME}/.codex/requirements.toml"
  - "${HOME}/.codex/hooks.json"
  - "${HOME}/.codex/hooks"
  - "${HOME}/.codex/rules"
  - "${HOME}/.pi/agent/extensions"
  - "${HOME}/.pi/agent/agents-adapter-isolation.yaml"
  - "${HOME}/.zshrc"
  - "${HOME}/.zprofile"
  - "${HOME}/.zshenv"
  - "${HOME}/.bashrc"
  - "${HOME}/.bash_profile"
  - "${HOME}/.profile"
  - "${HOME}/.gitconfig"
  - "/etc"
  - "/usr/local/etc"
  - "/opt/homebrew/etc"

# env var ที่ห้ามส่งเข้า subprocess ของ agent
credential_env_vars:
  - ANTHROPIC_API_KEY
  - ANTHROPIC_AUTH_TOKEN
  - OPENAI_API_KEY
  - GITHUB_TOKEN
  - GH_TOKEN
  - NPM_TOKEN
  - NODE_AUTH_TOKEN
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_SESSION_TOKEN
  - AZURE_CLIENT_SECRET
  - CLOUDFLARE_API_TOKEN
